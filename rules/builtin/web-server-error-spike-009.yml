id: web-server-error-spike-009
title: Web Application 5xx Server Error Burst
description: Sudden burst of HTTP 5xx errors returned by application servers or gateways.
source: web
match:
  field_regex:
    status: "^5[0-9]{2}$"
condition:
  count_gte: 15
  window: 5m
severity: medium
tags:
  - attack.impact
  - attack.t1499
references:
  - https://attack.mitre.org/techniques/T1499/
false_positives:
  - Upstream backend database maintenance or network outage

