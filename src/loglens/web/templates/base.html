<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LogLens - Security Log Triage and Automated Threat Detection">
  <title>{% block title %}LogLens{% endblock %}</title>
  <script src="/static/js/htmx.min.js"></script>
  <style>
    :root {
      --bg-page: #0d0f12;
      --bg-surface: #13161c;
      --bg-card: #181b22;
      --bg-raised: #1f232d;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --border-focus: rgba(56, 189, 248, 0.4);
      --text-primary: #ededf0;
      --text-secondary: #9aa0ac;
      --text-muted: #626a79;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-dim: rgba(56, 189, 248, 0.1);
      --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, "JetBrains Mono", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, -apple-system, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      max-width: 100vw;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      height: 52px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-primary);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    .brand-mark {
      width: 22px;
      height: 22px;
      background: var(--bg-raised);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 450;
      transition: color 0.15s;
    }

    nav a:hover, nav a.active {
      color: var(--text-primary);
    }

    nav a.active {
      color: var(--accent);
    }

    main {
      flex: 1;
      padding: 24px;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      min-width: 0;
    }

    footer {
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding: 12px 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      min-width: 0;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .metric-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
    }

    .metric-label {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      font-family: var(--font-mono);
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge-critical { background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.25); }
    .badge-high { background: rgba(249, 115, 22, 0.12); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.25); }
    .badge-medium { background: rgba(234, 179, 8, 0.12); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.25); }
    .badge-low { background: rgba(56, 189, 248, 0.12); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.25); }
    .badge-info { background: rgba(100, 116, 139, 0.12); color: #94a3b8; border: 1px solid rgba(100, 116, 139, 0.25); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--text-primary);
      color: #0f1115;
      border-color: var(--text-primary);
    }
    .btn-primary:hover {
      background: #e2e4e9;
      border-color: #e2e4e9;
    }

    .btn-accent {
      background: var(--accent);
      color: #090d16;
      border-color: var(--accent);
    }
    .btn-accent:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--bg-raised);
      border-color: var(--border-strong);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    .btn-sm {
      height: 26px;
      padding: 0 8px;
      font-size: 12px;
    }

    input[type="text"], input[type="password"], input[type="url"], input[type="number"], select, textarea {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    .code, pre, code {
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .code {
      background: var(--bg-card);
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: #e2e8f0;
    }

    pre {
      background: #0a0c10;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      color: #cbd5e1;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      max-width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 12px;
      background: var(--bg-surface);
    }

    tr:hover td {
      background-color: var(--bg-card);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
    }

    .htmx-indicator {
      display: none;
    }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator {
      display: inline-block;
    }

    @media (max-width: 860px) {
      header { padding: 0 16px; }
      main { padding: 16px; }
      nav { gap: 12px; }
      .metric-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <a href="/" class="brand">
      <div class="brand-mark">LL</div>
      <span>LogLens</span>
    </a>
    <nav>
      <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
      <a href="/live" class="{% if request.url.path.startswith('/live') %}active{% endif %}">Live monitor</a>
      <a href="/analyze" class="{% if request.url.path.startswith('/analyze') %}active{% endif %}">New analysis</a>
      <a href="/settings" class="{% if request.url.path.startswith('/settings') %}active{% endif %}">Settings</a>
      <a href="/api/stats" target="_blank">API stats</a>
      <a href="https://github.com/ItsAdi22/LogLens-AI-Assisted-Security-Log-Triage" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    LogLens v1.0.0 &bull; Local-first security log triage
  </footer>
</body>
</html>
